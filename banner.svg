<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Priyanshu Kumar, AI/ML Engineer and Python Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#0a1a2c"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <pattern id="px" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="13" height="13" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe3ff"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="260" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <circle cx="180" cy="70" r="110" fill="#3b82f6" opacity="0.65" filter="url(#blur)">
      <animate attributeName="cx" values="180;300;180" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;180;70" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="190" r="120" fill="#06b6d4" opacity="0.55" filter="url(#blur)">
      <animate attributeName="cx" values="820;680;820" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;70;190" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="240" r="90" fill="#8b5cf6" opacity="0.5" filter="url(#blur)">
      <animate attributeName="cx" values="520;640;400;520" dur="16s" repeatCount="indefinite"/>
    </circle>
    <rect width="1000" height="260" fill="url(#px)"/>
    <g fill="#7dd3fc">
      <rect x="28" y="28" width="14" height="14" opacity="0.2"><animate attributeName="opacity" values="0.05;0.7;0.05" dur="3.2s" repeatCount="indefinite"/></rect>
      <rect x="56" y="42" width="14" height="14" opacity="0.2"><animate attributeName="opacity" values="0.6;0.05;0.6" dur="4.1s" repeatCount="indefinite"/></rect>
      <rect x="42" y="70" width="14" height="14" opacity="0.2"><animate attributeName="opacity" values="0.05;0.5;0.05" dur="2.7s" repeatCount="indefinite"/></rect>
      <rect x="930" y="196" width="14" height="14" opacity="0.2"><animate attributeName="opacity" values="0.05;0.7;0.05" dur="3.6s" repeatCount="indefinite"/></rect>
      <rect x="944" y="224" width="14" height="14" opacity="0.2"><animate attributeName="opacity" values="0.6;0.05;0.6" dur="2.9s" repeatCount="indefinite"/></rect>
      <rect x="916" y="224" width="14" height="14" opacity="0.2"><animate attributeName="opacity" values="0.05;0.5;0.05" dur="4.4s" repeatCount="indefinite"/></rect>
      <rect x="958" y="30" width="14" height="14" opacity="0.2"><animate attributeName="opacity" values="0.4;0.05;0.4" dur="3.8s" repeatCount="indefinite"/></rect>
    </g>
    <rect x="70" y="42" width="860" height="176" rx="26" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <rect x="72" y="44" width="856" height="70" rx="24" fill="#ffffff" opacity="0.04"/>
    <text x="500" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="1" fill="url(#name)">Priyanshu Kumar</text>
    <text x="500" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="4" fill="#cfe8ff">AI/ML ENGINEER  ·  PYTHON DEVELOPER</text>
    <text x="500" y="197" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#7dd3fc" opacity="0.85">LLMs  /  RAG  /  vLLM  /  FastAPI</text>
  </g>
</svg>
